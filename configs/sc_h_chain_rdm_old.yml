system:
  lattice_vectors:            # 3x3 primitive cell vectors (Bohr)
  # Following approach in two_atom_chain.py, where the lattice is made effectively 1D by using very large lattice constants in y and z directions.
    - [7.56, 0.0, 0.0]
    - [0.0, 100.0, 0.0]
    - [0.0, 0.0, 100.0] 
  atoms:
    - symbol: Sc
      coords: [0.0, 0.0, 0.0]
      charge: 11.0
    - symbol: H
      coords: [3.78, 0.0, 0.0]
      charge: 1.0
  # Sc (with ccecp): 21 total electrons - 10 core = 11 valence electrons. H: 1 valence electron. Total = 12 electrons per unit cell. 
  electron_spins: [6, 6]     
  basis: 
    Sc: ccecpccpvdz
    H: cc-pvdz
  ecp:
    Sc: ccecp

estimators:
  enabled:
    rdm: true
  
  rdm:
    n_sweeps: 2
    aux_steps: 10       
    batch_size: 2048 #This doesn't sets it, just tells the estimator the batch size to determine the size of the r' pool to generate
    phi_i: '0 Sc 3dxy'
    phi_j: '1 H 1s'

# Needs this to prevent some writer errors
train:
  writers:
    console: null
    csv: null


