system:
  module: two_atom_chain
  symbol: Sc                  # Atomic symbol (both atoms are the same element)
  bond_length: 6.00           # Distance between atoms along the chain
  unit: bohr                 # or "angstrom"
  spin: 2                    # n_up - n_down per primitive cell
  # supercell: 4             # Optional repetition along the chain direction
  # basis: sto-3g
  basis: ccecpccpvdz
  ecp: ccecp
