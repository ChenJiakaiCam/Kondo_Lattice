      coords: [22.68, 0.0, 0.0]
      charge: 1.0
    - symbol: H
      coords: [26.46, 0.0, 0.0]
      charge: 1.0
    - symbol: H
      coords: [30.24, 0.0, 0.0]
      charge: 1.0
    - symbol: H
      coords: [34.02, 0.0, 0.0]
      charge: 1.0
