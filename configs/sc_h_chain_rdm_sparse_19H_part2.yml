      coords: [71.82, 0.0, 0.0]
      charge: 1.0
  
  electron_spins: [15, 15]     
  basis: 
    Sc: ccecpccpvdz
    H: cc-pvdz
  ecp:
    Sc: ccecp
  # supercell_matrix: 
  #   [[1, 0, 0], [0, 1, 0], [0, 0, 1]] # Following approach in two_atom_chain.py

estimators:
  enabled:
    rdm: true
  
  rdm:
    n_sweeps: 1
    aux_steps: 10       
    batch_size: 2048 #This doesn't sets it, just tells the estimator the batch size to determine the size of the r' pool to generate
    rdm_orbitals: 
      - '0 Sc 4s'
      - '0 Sc 3dxy'
      - '0 Sc 3dyz'
      - '0 Sc 3dz^2'
      - '0 Sc 3dxz'
      - '0 Sc 3dx2-y2'
      # - '1 H 1s' # Assume conduction band formed by hybridization of Sc 4s and H 1s orbitals only
      # - '2 H 1s'
      # - '3 H 1s'
      # - '4 H 1s'
      # - '5 H 1s'
      # - '6 H 1s' 
      # - '7 H 1s'
      # - '8 H 1s'
      # - '9 H 1s'
      - '10 H 1s'
      - '11 H 1s'
      - '12 H 1s'
      - '13 H 1s'
      - '14 H 1s'
      - '15 H 1s'
      - '16 H 1s' 
      - '17 H 1s'
      - '18 H 1s'
      - '19 H 1s'

