#'1 H 1s    ', '1 H 2s    ', '1 H 2px   ', '1 H 2py   ', '1 H 2pz   ']
estimators:
  enabled:
    rdm_gaussian_init: true
  
  rdm_gaussian_init:
    n_sweeps: 1
    aux_steps: 10       
    batch_size: 2048 #This doesn't sets it, just tells the estimator the batch size to determine the size of the r' pool to generate
    rdm_orbitals: 
      - '8 H 1s'
      - '8 H 2s'
      - '8 H 2px'
      - '8 H 2py'
      - '8 H 2pz'


