system:
  lattice_vectors:            # 3x3 primitive cell vectors (Bohr)
  # Following approach in two_atom_chain.py, where the lattice is made effectively 1D by using very large lattice constants in y and z directions.
    - [7.56, 0.0, 0.0]
    - [0.0, 100.0, 0.0]
    - [0.0, 0.0, 100.0]
  atoms:
    - symbol: Fe
      coords: [0.0, 0.0, 0.0]
    - symbol: H
      coords: [3.78, 0.0, 0.0]
  # Fe (with ccecp): 26 total electrons - 10 core = 16 valence electrons. H: 1 valence electron. Total = 17 electrons per unit cell.
  electron_spins: [9, 8]
  basis:
    Fe: ccecpccpvdz
    H: cc-pvdz
  ecp:
    Fe: ccecp
