system:
  lattice_vectors:            # 3x3 primitive cell vectors (Bohr)
  # Following approach in two_atom_chain.py, where the lattice is made effectively 1D by using very large lattice constants in y and z directions.
    - [7.56, 0.0, 0.0]
    - [0.0, 100.0, 0.0]
    - [0.0, 0.0, 100.0] 
  atoms:
    - symbol: Sc
      coords: [0.0, 0.0, 0.0]
      charge: 11.0
    - symbol: H
      coords: [3.78, 0.0, 0.0]
      charge: 1.0
  # Sc (with ccecp): 21 total electrons - 10 core = 11 valence electrons. H: 1 valence electron. Total = 12 electrons per unit cell. 
  electron_spins: [6, 6]     
  basis: 
    Sc: ccecpccpvdz
    H: cc-pvdz
  ecp:
    Sc: ccecp

# estimators:
#   enabled:
#     density: true
#   density:
#     axes:
#       a: 
#         lattice_index: 0
#         bins: 100          # Higher resolution for your 1D chain
#       b: null              # Ignore the 100.0 Bohr vacuum axis
#       c: null              # Ignore the 100.0 Bohr vacuum axis


estimators:
  enabled:
    density: true
  density:
    axes:
      a: 
        lattice_index: 0
        bins: 50          
      a: 
        lattice_index: 1
        bins: 500          
      c: null             